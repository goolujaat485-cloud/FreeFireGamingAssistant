name: Build Gaming Assistant APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir /tmp/project
          unzip *.zip -d /tmp/project

      - name: Build APK
        run: |
          cd /tmp/project
          PROJECT=$(find . -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$PROJECT"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Gaming-Assistant-APK
          path: /tmp/project/**/build/outputs/apk/debug/*.apk
