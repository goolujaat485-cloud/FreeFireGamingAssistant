
name: Build Gaming Assistant APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/project
          unzip -o *.zip -d /tmp/project

      - name: Find Android project
        run: |
          PROJECT=$(find /tmp/project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          echo "Found project: $PROJECT"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Assistant-APK
          path: /tmp/project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
